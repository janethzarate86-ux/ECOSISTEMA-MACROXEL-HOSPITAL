async function fetchJson(url,timeout=4500){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)return null;return await r.json().catch(()=>null)}catch(_e){return null}finally{clearTimeout(t)}}
async function fallbackState(){const c=cfg(),db=clean(c.db||c.firebaseUrl||''),sid=txt(c.branch||window.mxFixedPrincipalBinding?.systemId||'').toUpperCase();if(!db||!sid)return{firebase:false,principalOnline:false,paused:false,reason:'Esperando asociación con Sistema Principal'};let fb=false;try{const r=await fetch(db+'/viewer_users/'+encodeURIComponent(sid)+'/__mx_connection_probe__.json?mxprobe='+Date.now(),{cache:'no-store'});fb=r.ok}catch(_e){fb=false}const pres=await fetchJson(CONTROL_DB+'/inventory_heartbeat/principal_status/'+encodeURIComponent(sid)+'.json?ts='+Date.now(),4500),last=Number(pres?.lastSeenMs)||Date.parse(pres?.lastSeenAt||0)||0,ps=pres?.connectionPaused===true||pres?.remoteDisconnected===true||pres?.remoteAdminLocked===true;return{firebase:fb,principalOnline:!!last&&Date.now()-last<ONLINE_MS&&!ps,paused:ps,reason:fb?(ps?'Sistema Principal pausado':'Firebase operativa disponible'):'Firebase operativa no responde'}}
function evidence(){try{const h=window.mxCollectiveSyncHealth?.();if(h?.ready===true)sessionReady=true}catch(_e){}try{const h=window.mxEcosystemSyncHealth?.();if(Number(h?.dataOkAt||0)>0)sessionReady=true}catch(_e){}if(sessionReady)render()}
function armReadyFallback(){clearTimeout(readyTimer);if(!firebase||!principal||sessionReady)return;readyTimer=setTimeout(()=>{if(firebase&&principal&&!paused&&!sessionReady){sessionReady=true;render()}},READY_FALLBACK_MS)}
function hardReset(reason='nueva asociación'){checked=false;firebase=false;principal=false;paused=false;sessionReady=false;firebaseFails=0;principalFails=0;clearTimeout(readyTimer);detail='Verificando '+reason;render()}
function bindingChanged(reason='asociación'){const next=signature();if(bindingSig&&next===bindingSig){setTimeout(()=>check(true),80);return false}bindingSig=next;hardReset(reason);setTimeout(()=>check(true),100);return true}
async function check(force=false){const now=Date.now();if(busy)return level;if(!force&&now-lastCheckAt<MIN_CHECK_MS)return level;lastCheckAt=now;busy=true;try{const sig=signature();if(bindingSig&&sig!==bindingSig){bindingSig=sig;hardReset('nueva asociación')}else if(!bindingSig)bindingSig=sig;let st=null;try{st=await window.mxFixedPrincipalBinding?.connectionState?.()}catch(_e){st=null}if(!st)st=await fallbackState();const nextFb=st?.firebase===true,nextPr=st?.principalOnline===true&&st?.paused!==true,nextPaused=st?.paused===true;firebaseFails=nextFb?0:firebaseFails+1;principalFails=nextPr?0:principalFails+1;const wasGreen=level==='green';if(wasGreen&&navigator.onLine!==false&&!nextFb&&firebaseFails<2){setTimeout(()=>check(true),CONFIRM_FAIL_MS);return level}if(wasGreen&&nextFb&&!nextPr&&principalFails<2){setTimeout(()=>check(true),CONFIRM_FAIL_MS);return level}const principalRecovered=checked&&firebase&&principal===false&&nextPr;firebase=nextFb;principal=nextPr;paused=nextPaused;checked=true;detail=txt(st?.reason||'');if(principalRecovered)sessionReady=false;evidence();render();armReadyFallback();return level}catch(e){if(navigator.onLine===false){checked=true;firebase=false;principal=false;detail='Sin Internet';render()}return level}finally{busy=false}}
window.mxStableConnectionCheck=(force=false)=>check(!!force);
window.mxStableConnectionState=()=>({connected:level!=='red',level,detail,state:{firebase,principalOnline:principal,paused},ready:sessionReady});
window.mxStableConnectionReport=(ok,why='',hard=false,state=null)=>{if(state&&typeof state==='object'){if(state.firebase===true)firebase=true;if(state.principalOnline===true)principal=true;if(state.paused===true)paused=true}if(hard&&ok===false&&navigator.onLine===false){checked=true;firebase=false;principal=false;detail=why||'Sin Internet';render();return false}if(ok===true)evidence();else setTimeout(()=>check(true),80);return level!=='red'};
window.mxConnectionMaster={check,state:window.mxStableConnectionState,markReady(){sessionReady=true;render()},reset(reason='manual'){bindingSig='';hardReset(reason);setTimeout(()=>check(true),100)}};
window.addEventListener('mx-ecosystem-sync-health',e=>{if(Number(e?.detail?.dataOkAt||0)>0){sessionReady=true;render()}});
window.addEventListener('mx-collective-sync-health',e=>{if(e?.detail?.ready===true){sessionReady=true;render()}});
window.addEventListener('mx-resume-sync-state',e=>{if(e?.detail?.state==='done'&&firebase&&principal){evidence();if(!sessionReady){sessionReady=true;render()}}});
window.addEventListener('mx-viewer-binding-updated',()=>bindingChanged('nueva asociación'));
window.addEventListener('mx-viewer-config-changed',()=>bindingChanged('nueva configuración'));
window.addEventListener('mx-admin-target-changed',()=>bindingChanged('nuevo Sistema Principal'));
window.addEventListener('mx-maintenance-changed',()=>setTimeout(()=>check(true),80));
window.addEventListener('offline',()=>{checked=true;firebase=false;principal=false;sessionReady=false;detail='Sin Internet';render()});
window.addEventListener('online',()=>{checked=false;firebase=false;principal=false;sessionReady=false;detail='Recuperando conexión';render();setTimeout(()=>check(true),120)});
window.addEventListener('focus',()=>{if(Date.now()-lastCheckAt>5000)setTimeout(()=>check(true),100)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastCheckAt>5000)setTimeout(()=>check(true),120)});
function boot(){bindingSig=signature();mount();evidence();render();check(true);setTimeout(()=>check(true),1400);setInterval(()=>check(false),CHECK_MS)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
