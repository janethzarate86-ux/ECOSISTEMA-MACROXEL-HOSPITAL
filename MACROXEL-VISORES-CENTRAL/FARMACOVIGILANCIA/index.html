<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MACROXEL Farmacovigilancia</title></head>
<body style="margin:0;background:#eef7fc;font-family:system-ui">
<div id="mxLoad" style="min-height:100vh;display:grid;place-items:center;color:#0b4f7d;font-weight:800">Cargando Farmacovigilancia…</div>
<script>
(async()=>{
const SOURCE='./index.full.html',ENH='./enhancer.v106.js',CACHE='macroxel-farmacovigilancia-v106';
const render=(html,js)=>{const patch=js+'\n;mxFvEnhancer();',inject='<script>'+patch.replace(/<\/script/gi,'<\\/script')+'<\/script>',pos=html.toLowerCase().lastIndexOf('</body>');html=pos>=0?html.slice(0,pos)+inject+html.slice(pos):html+inject;document.open();document.write(html);document.close()};
try{
 const [rh,rj]=await Promise.all([fetch(SOURCE+'?mx='+Date.now(),{cache:'no-store'}),fetch(ENH+'?mx='+Date.now(),{cache:'no-store'})]);
 if(!rh.ok||!rj.ok)throw new Error('HTTP '+rh.status+'/'+rj.status);
 const [html,js]=await Promise.all([rh.text(),rj.text()]);
 if(!/<html[\s>]/i.test(html)||!js.includes('function mxFvEnhancer'))throw new Error('Contenido inválido');
 try{const c=await caches.open(CACHE);await Promise.all([c.put(SOURCE,new Response(html,{headers:{'Content-Type':'text/html; charset=utf-8'}})),c.put(ENH,new Response(js,{headers:{'Content-Type':'text/javascript; charset=utf-8'}}))])}catch(_e){}
 render(html,js);
}catch(e){
 try{const c=await caches.open(CACHE),[rh,rj]=await Promise.all([c.match(SOURCE),c.match(ENH)]);if(rh&&rj){render(await rh.text(),await rj.text());return}}catch(_e){}
 document.getElementById('mxLoad').textContent='No se pudo cargar Macroxel Farmacovigilancia. Verifica la conexión.';
}
})();
</script>
</body></html>
