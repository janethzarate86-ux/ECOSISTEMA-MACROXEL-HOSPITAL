name: Macroxel Revert Tablet

on:
  push:
    paths:
      - '.github/workflows/macroxel-revert-tablet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-tablet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regresar visores a versión anterior
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6d93108d37054c5417c693fc7c8ffc1780a40f9a -- MACROXEL-VISORES-CENTRAL/*/index.html
          git config user.name 'Macroxel Hospital'
          git config user.email 'macroxel-hospital@users.noreply.github.com'
          git add MACROXEL-VISORES-CENTRAL/*/index.html
          if git diff --cached --quiet; then
            echo 'Ya estaba en la versión anterior.'
            exit 0
          fi
          git commit -m 'Macroxel Hospital: regresar versión anterior de tablets'
          git push
