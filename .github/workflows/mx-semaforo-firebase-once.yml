name: Macroxel - unificar semaforo Firebase

on:
  push:
    paths:
      - '.github/workflows/mx-semaforo-firebase-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar semaforo simple Firebase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('MACROXEL-VISORES-CENTRAL')
          old_render="function render(){if(!checked){paint('orange','Verificando','Comprobando Firebase y Sistema Principal');return}if(!firebase){paint('red','Sin Firebase',detail||'Firebase operativa no disponible');return}if(!principal||paused){paint('orange','Firebase OK · Principal pendiente',paused?'Sistema Principal pausado':'Firebase activa · esperando Sistema Principal');return}if(!sessionReady){paint('orange','Sincronizando','Firebase y Sistema Principal activos · completando sincronización inicial');return}paint('green','100% conectado','Firebase activa · Sistema Principal en línea · datos sincronizados')}"
          new_render="function render(){if(!checked){paint('orange','Verificando','Comprobando conexión con Firebase');return}if(!firebase){paint('red','Sin conexión',detail||'Firebase operativa no disponible');return}paint('green','Conectado','Firebase activa · operación disponible · los pedidos pueden permanecer en cola hasta ser procesados')}"
          old_conn="function connectionStatus(){try{const s=window.mxStableConnectionState?.();if(s&&typeof s.level==='string'){const level=s.level==='green'?'green':s.level==='red'?'red':'orange',fb=s?.state?.firebase===true,pr=s?.state?.principalOnline===true,paused=s?.state?.paused===true;let label='● Verificando';if(level==='green')label='● 100% conectado';else if(level==='red')label='● Sin Firebase';else if(paused)label='● Firebase OK · Principal pausado';else if(fb&&!pr)label='● Firebase OK · Principal pendiente';else if(fb&&pr)label='● Sincronizando';return{level,label}}}catch(_e){}if(navigator.onLine===false)return{level:'red',label:'● Sin conexión'};const level=document.documentElement.dataset.mxConnectionLevel||'orange';return level==='green'?{level:'green',label:'● 100% conectado'}:level==='red'?{level:'red',label:'● Sin Firebase'}:{level:'orange',label:'● Verificando'}}"
          new_conn="function connectionStatus(){try{const s=window.mxStableConnectionState?.();if(s){const fb=s?.state?.firebase===true;if(fb)return{level:'green',label:'● Conectado'};if(s.level==='red')return{level:'red',label:'● Sin conexión'}}}catch(_e){}if(navigator.onLine===false)return{level:'red',label:'● Sin conexión'};const level=document.documentElement.dataset.mxConnectionLevel||'orange';return level==='green'?{level:'green',label:'● Conectado'}:level==='red'?{level:'red',label:'● Sin conexión'}:{level:'orange',label:'● Verificando'}}"
          changed=[]
          for p in sorted(root.glob('*/index*.html')):
              if p.parent.name=='FARMACOVIGILANCIA' and p.name=='index.html':
                  continue
              s=p.read_text(encoding='utf-8')
              before=s
              s=s.replace(old_render,new_render).replace(old_conn,new_conn)
              s=s.replace("return s.level==='green'?'● 100% conectado':s.level==='red'?'● Sin Firebase':paused?'● Firebase OK · Principal pausado':fb&&!pr?'● Firebase OK · Principal pendiente':fb&&pr?'● Sincronizando':'● Verificando'","return fb?'● Conectado':s.level==='red'?'● Sin conexión':'● Verificando'")
              s=s.replace("function sourceState(){try{const s=window.mxStableConnectionState?.();if(s&&typeof s.level==='string')return s.level==='green'?'ok':s.level==='red'?'bad':'warn'}catch(_e){}","function sourceState(){try{const s=window.mxStableConnectionState?.();if(s){if(s?.state?.firebase===true)return'ok';if(s.level==='red')return'bad';return'warn'}}catch(_e){}")
              s=s.replace("const label=st==='ok'?'100% conectado':st==='warn'?'Firebase OK · Principal pendiente':'Sin conexión'","const label=st==='ok'?'Conectado':st==='warn'?'Verificando Firebase':'Sin conexión'")
              s=s.replace("${st==='ok'?'● 100% conectado':st==='bad'?'● Sin conexión':'● Firebase OK · Principal pendiente'}","${st==='ok'?'● Conectado':st==='bad'?'● Sin conexión':'● Verificando Firebase'}")
              s=s.replace("'● 100% conectado'","'● Conectado'")
              s=s.replace("'● Sin Firebase'","'● Sin conexión'")
              s=s.replace("'● Firebase OK · Principal pausado'","'● Conectado'")
              s=s.replace("'● Firebase OK · Principal pendiente'","'● Conectado'")
              if s!=before:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Archivos modificados:', len(changed))
          for x in changed: print(x)
          if len(changed) != 9:
              raise SystemExit(f'Se esperaban 9 archivos modificados y fueron {len(changed)}')
          PY
      - name: Verificar que no queden estados Principal pendiente
        shell: bash
        run: |
          if grep -R -n --include='index*.html' -E 'Firebase OK · Principal pendiente|Firebase OK · Principal pausado|100% conectado|Sin Firebase' MACROXEL-VISORES-CENTRAL; then
            echo 'Quedaron etiquetas antiguas'
            exit 1
          fi
      - name: Guardar cambio y retirar workflow temporal
        shell: bash
        run: |
          git config user.name 'janethzarate86-ux'
          git config user.email 'janeth.zarate86@gmail.com'
          git rm .github/workflows/mx-semaforo-firebase-once.yml
          git add MACROXEL-VISORES-CENTRAL
          git commit -m 'Visores: semaforo verde por Firebase operativa'
          git push
