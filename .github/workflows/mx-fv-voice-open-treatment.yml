name: Aplicar Farmacovigilancia voz

on:
  push:
    paths:
      - '.github/workflows/mx-fv-voice-open-treatment.yml'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar Farmacovigilancia
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('MACROXEL-VISORES-CENTRAL/FARMACOVIGILANCIA/index.html')
          s=p.read_text(encoding='utf-8')
          if 'function fvNotifyPending(pending)' not in s:
              old="fvValidationLoading=null,lastJustifiedVoice='';"
              new="fvValidationLoading=null,fvVoiceReady=false,fvAnnouncedPending=new Set();"
              assert s.count(old)==1
              s=s.replace(old,new,1)
              start=s.find('function fvVoice(order){')
              end=s.find('\nfunction renderJustifiedValidations()',start)
              assert start>=0 and end>start
              block=r'''function fvAlertOrderItems(o){const raw=o?.items;return Array.isArray(raw)?raw:(raw&&typeof raw==='object'?Object.values(raw):[])}
function fvOtherOpenTreatments(order){const id=txt(order?.id||order?.folioSolicitud||order?.folio),patient=norm(order?.paciente),file=norm(order?.expediente);return justifiedOrders.filter(o=>{const oid=txt(o?.id||o?.folioSolicitud||o?.folio);if(!oid||oid===id||!fvJustified(o)||fvJustOrderStatus(o)!=='open')return false;const otherPatient=norm(o?.paciente),otherFile=norm(o?.expediente);if(patient)return otherPatient===patient;return !!file&&otherFile===file})}
function fvOpenTreatmentSummary(order){const orders=fvOtherOpenTreatments(order),drugs=[...new Set(orders.flatMap(fvAlertOrderItems).map(it=>txt(it?.descripcion||it?.clave)).filter(Boolean))];return{orders,drugs}}
function fvSpeakNotice(message){try{if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return;const u=new SpeechSynthesisUtterance(message);u.lang='es-MX';u.rate=.92;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}catch(_e){}}
function fvVoice(order){const v=fvValidation(order);if(v.validated)return;const id=txt(order?.id||order?.folioSolicitud||order?.folio);if(!id)return;const it=fvAlertOrderItems(order)[0]||{},patient=txt(order?.paciente)||'paciente',drug=txt(it?.descripcion||it?.clave)||'medicamento',summary=fvOpenTreatmentSummary(order);let spoken=`Colectivo justificado pendiente de validación por farmacovigilancia. Paciente ${patient}. Medicamento solicitado ${drug}.`;if(summary.orders.length){spoken+=` Atención. El paciente ya tiene ${summary.orders.length} ${summary.orders.length===1?'colectivo abierto':'colectivos abiertos'}`;spoken+=summary.drugs.length?` con ${summary.drugs.join(', ')}.`:'.'}fvSpeakNotice(spoken);const toast=$('fvJustVoiceToast'),msg=$('fvJustVoiceText');if(toast&&msg){const prior=summary.orders.length?` · ⚠ ${summary.orders.length} ${summary.orders.length===1?'colectivo abierto':'colectivos abiertos'}${summary.drugs.length?`: ${summary.drugs.join(', ')}`:''}`:'';msg.textContent=`${patient} · ${drug} · ${fvRequestQty(it)} pzs${prior}`;toast.dataset.fvOrder=id;toast.setAttribute('role','button');toast.setAttribute('aria-label','Abrir colectivo justificado pendiente de validación');toast.tabIndex=0;const openNotice=()=>{toast.classList.remove('show');showView('justifiedValidation');requestAnimationFrame(()=>{setTimeout(()=>openFvJustifiedDetail(id),80)})};toast.onclick=openNotice;toast.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNotice()}};toast.classList.add('show');setTimeout(()=>{if(toast.dataset.fvOrder===id)toast.classList.remove('show')},10000)}}
function fvNotifyPending(pending){const list=(pending||[]).filter(o=>o&&!fvValidation(o).validated),idOf=o=>txt(o?.id||o?.folioSolicitud||o?.folio),ids=new Set(list.map(idOf).filter(Boolean));for(const id of Array.from(fvAnnouncedPending))if(!ids.has(id))fvAnnouncedPending.delete(id);if(!fvVoiceReady){fvVoiceReady=true;list.forEach(o=>{const id=idOf(o);if(id)fvAnnouncedPending.add(id)});if(list.length)fvVoice(list[0]);return}const fresh=list.filter(o=>{const id=idOf(o);return id&&!fvAnnouncedPending.has(id)}).sort((a,b)=>String(a?.createdAt||a?.requestedAt||a?.fechaIso||'').localeCompare(String(b?.createdAt||b?.requestedAt||b?.fechaIso||'')));fresh.forEach(o=>{const id=idOf(o);if(id)fvAnnouncedPending.add(id);fvVoice(o)})}'''
              s=s[:start]+block+s[end:]
              old_tail='if(pending.length)fvVoice(pending[0])}'
              assert s.count(old_tail)==1
              s=s.replace(old_tail,'fvNotifyPending(pending)}',1)
              p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          checks=['fvVoiceReady=false','function fvOtherOpenTreatments(order)','function fvOpenTreatmentSummary(order)','function fvNotifyPending(pending)','Medicamento solicitado ${drug}','El paciente ya tiene ${summary.orders.length}','fvNotifyPending(pending)}']
          for x in checks: assert x in s,x
          assert "lastJustifiedVoice=''" not in s
          print('OK Farmacovigilancia')
          PYCODE
      - name: Validar y guardar
        shell: bash
        run: |
          set -euo pipefail
          test "$(find MACROXEL-VISORES-CENTRAL -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 9
          git config user.name 'janethzarate86-ux'
          git config user.email 'janethzarate86-ux@users.noreply.github.com'
          git add MACROXEL-VISORES-CENTRAL/FARMACOVIGILANCIA/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Farmacovigilancia: voz y tratamientos abiertos por paciente'
          git push origin HEAD:main
