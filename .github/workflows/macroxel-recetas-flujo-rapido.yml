name: Macroxel Recetas flujo rapido 1.0.2
on:
  push:
    paths:
      - '.github/workflows/macroxel-recetas-flujo-rapido.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ajustar flujo rapido de Recetas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os
          p=Path('MACROXEL-VISORES-CENTRAL/Recetas-surtido/index.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise RuntimeError(f'marker count {n}!={count}: {old[:120]!r}')
              s=s.replace(old,new,count)
          rep("const VERSION='1.0.1',APP_CODE='RECETAS',APP_NAME='MACROXEL Recetas';","const VERSION='1.0.2',APP_CODE='RECETAS',APP_NAME='MACROXEL Recetas';")
          rep(".input:focus,.select:focus{border-color:#4f9bcc;box-shadow:0 0 0 3px #4f9bcc20}",".input:focus,.select:focus{border-color:#4f9bcc;box-shadow:0 0 0 3px #4f9bcc20}.field.mx-flow-active>label{color:#0b69a3}.field.mx-flow-active .input,.field.mx-flow-active .select{border-color:#0b79b7;box-shadow:0 0 0 4px #0b79b726;background:#f8fdff}.field.mx-flow-active{scroll-margin-top:66px}")
          old='''  <section class="card"><h3>🧾 Datos de la receta</h3>
            <div class="field" style="margin-bottom:8px"><label>Usuario que surte · queda fijo en este dispositivo</label><select class="select" id="servedBy"><option value="">Selecciona usuario</option></select></div>
            <div class="grid">
              <div class="field"><label>Tipo de receta</label><select class="select" id="recipeType"><option value="">Selecciona</option><option value="Receta Carta">Receta Carta</option><option value="Receta Media carta">Receta Media carta</option><option value="Receta ordinaria">Receta ordinaria</option><option value="Receta antibióticos">Receta antibióticos</option></select></div>
              <div class="field"><label>Estado</label><select class="select" id="recipeState"><option value="">Selecciona</option><option value="Completa">Receta completa</option><option value="Incompleta">Receta incompleta</option></select></div>
              <div class="field full"><label>Folio receta</label><input class="input" id="recipeFolio" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" autocapitalize="off" placeholder="Folio de la receta"><div class="folio-sync" id="folioSync">Selecciona el tipo de receta para consultar el siguiente folio.</div></div>
              <div class="field autocomplete"><label>Nombre médico</label><input class="input" id="doctorName" autocomplete="off" placeholder="Escribe nombre o cédula" aria-autocomplete="list" aria-controls="doctorSuggestions"><div class="doctor-suggestions hidden" id="doctorSuggestions" role="listbox"></div></div>
              <div class="field"><label>Cédula</label><input class="input" id="doctorLicense" inputmode="numeric" autocomplete="off" placeholder="Cédula profesional"></div>
            </div>
          </section>'''
          new='''  <section class="card"><h3>🧾 Datos de la receta</h3>
            <div class="grid">
              <div class="field"><label>Usuario que surte · fijo en este dispositivo</label><select class="select" id="servedBy"><option value="">Selecciona usuario</option></select></div>
              <div class="field"><label>Tipo de receta</label><select class="select" id="recipeType"><option value="">Selecciona</option><option value="Receta Carta">Receta Carta</option><option value="Receta Media carta">Receta Media carta</option><option value="Receta ordinaria">Receta ordinaria</option><option value="Receta antibióticos">Receta antibióticos</option></select></div>
              <div class="field"><label>Estado</label><select class="select" id="recipeState"><option value="">Selecciona</option><option value="Completa">Receta completa</option><option value="Incompleta">Receta incompleta</option></select></div>
              <div class="field"><label>Folio receta</label><input class="input" id="recipeFolio" type="text" inputmode="numeric" enterkeyhint="next" autocomplete="off" autocapitalize="off" placeholder="Folio de la receta"><div class="folio-sync" id="folioSync">Selecciona el tipo de receta para consultar el siguiente folio.</div></div>
              <div class="field autocomplete"><label>Nombre médico</label><input class="input" id="doctorName" type="text" inputmode="text" enterkeyhint="next" autocomplete="off" autocapitalize="words" placeholder="Escribe nombre o cédula" aria-autocomplete="list" aria-controls="doctorSuggestions"><div class="doctor-suggestions hidden" id="doctorSuggestions" role="listbox"></div></div>
              <div class="field"><label>Cédula</label><input class="input" id="doctorLicense" inputmode="numeric" autocomplete="off" placeholder="Cédula profesional"></div>
            </div>
          </section>'''
          rep(old,new)
          old="function folioCaptureSeed(value){const v=txt(value);if(!v)return'';return v.endsWith('-')?v:v+'-'}function focusRecipeFolioTail(){const input=$('recipeFolio');if(!input)return;input.setAttribute('inputmode','numeric');input.setAttribute('enterkeyhint','next');const place=()=>{try{input.focus({preventScroll:true})}catch(_e){input.focus()}const end=String(input.value||'').length;try{input.setSelectionRange(end,end)}catch(_e){}};try{if(document.activeElement===input)input.blur()}catch(_e){};place();requestAnimationFrame(()=>{place();try{input.scrollIntoView({block:'center',behavior:'smooth'})}catch(_e){}});setTimeout(place,160)}"
          new="""function folioCaptureSeed(value){const v=txt(value);if(!v)return'';return v.endsWith('-')?v:v+'-'}
          function mxRecipeFlowMark(id){document.querySelectorAll('.field.mx-flow-active').forEach(x=>x.classList.remove('mx-flow-active'));const el=$(id),field=el?.closest?.('.field');if(field)field.classList.add('mx-flow-active');return el}
          function mxRecipeFlowFocus(id,{selectAll=false,scroll=true}={}){const el=mxRecipeFlowMark(id);if(!el)return;try{el.focus({preventScroll:true})}catch(_e){el.focus()}if(selectAll&&typeof el.select==='function'&&txt(el.value)){try{el.select()}catch(_e){}}if(scroll)requestAnimationFrame(()=>{try{el.closest('.field')?.scrollIntoView({block:'center',behavior:'smooth'})}catch(_e){}})}
          function focusRecipeFolioTail(){const input=$('recipeFolio');if(!input)return;input.setAttribute('inputmode','numeric');input.setAttribute('enterkeyhint','next');mxRecipeFlowMark('recipeFolio');const place=()=>{try{input.focus({preventScroll:true})}catch(_e){input.focus()}const end=String(input.value||'').length;try{input.setSelectionRange(end,end)}catch(_e){}};place();requestAnimationFrame(()=>{place();try{input.closest('.field')?.scrollIntoView({block:'center',behavior:'smooth'})}catch(_e){}})}
          function focusDoctorForFlow(){const input=$('doctorName');if(!input)return;input.setAttribute('inputmode','text');input.setAttribute('enterkeyhint','next');const confirmed=txt(input.dataset.mxConfirmedDoctor),selectAll=!!confirmed&&norm(input.value)===norm(confirmed);mxRecipeFlowFocus('doctorName',{selectAll});renderDoctorSuggestions()}
          function focusProductForFlow(){setProductSearchMode('numeric',false);mxRecipeFlowMark('productSearch');focusProductSearch(false)}"""
          rep(old,new)
          rep("const currentType=txt($('recipeType')?.value),folioInput=$('recipeFolio'),idle=!cart.length&&!txt($('doctorName')?.value)&&!txt($('doctorLicense')?.value)&&!txt($('recipeState')?.value)&&(!txt(folioInput?.value)||folioInput?.dataset.mxAutoFolio==='1')&&(!currentType||norm(currentType)===norm(type));","const currentType=txt($('recipeType')?.value),folioInput=$('recipeFolio'),doctorInput=$('doctorName'),doctorReusable=!!txt(doctorInput?.dataset.mxConfirmedDoctor)&&norm(doctorInput?.value)===norm(doctorInput?.dataset.mxConfirmedDoctor),idle=!cart.length&&(!txt(doctorInput?.value)||doctorReusable)&&!txt($('recipeState')?.value)&&(!txt(folioInput?.value)||folioInput?.dataset.mxAutoFolio==='1')&&(!currentType||norm(currentType)===norm(type));")
          rep("function chooseDoctor(d){if(!d)return;$('doctorName').value=txt(d.nombre);if(txt(d.cedula))$('doctorLicense').value=txt(d.cedula);hideDoctorSuggestions();saveDraft()}","function chooseDoctor(d,advance=true){if(!d)return;const input=$('doctorName');input.value=txt(d.nombre);input.dataset.mxConfirmedDoctor=txt(d.nombre);if(txt(d.cedula))$('doctorLicense').value=txt(d.cedula);hideDoctorSuggestions();saveDraft();if(advance)requestAnimationFrame(()=>focusProductForFlow())}")
          rep("if($('doctorName'))$('doctorName').value=txt(d.doctor);if($('doctorLicense'))$('doctorLicense').value=txt(d.license);","if($('doctorName')){$('doctorName').value=txt(d.doctor);if(txt(d.doctor)&&txt(d.license))$('doctorName').dataset.mxConfirmedDoctor=txt(d.doctor)}if($('doctorLicense'))$('doctorLicense').value=txt(d.license);")
          rep("function clearDraftAndForm(keepType=false){const type=keepType?txt($('recipeType').value):'';cart=[];selectedProduct=null;$('recipeType').value=type;$('recipeState').value='';$('recipeFolio').value='';$('recipeFolio').dataset.mxAutoFolio='';$('doctorName').value='';$('doctorLicense').value='';$('productSearch').value='';hideDoctorSuggestions();renderSearch();renderCart();try{localStorage.removeItem(DRAFT_KEY)}catch(_e){}}","function clearDraftAndForm(keepType=false,keepDoctor=false){const type=keepType?txt($('recipeType').value):'',doctor=keepDoctor?txt($('doctorName').value):'',license=keepDoctor?txt($('doctorLicense').value):'';cart=[];selectedProduct=null;$('recipeType').value=type;$('recipeState').value='';$('recipeFolio').value='';$('recipeFolio').dataset.mxAutoFolio='';$('doctorName').value=doctor;$('doctorLicense').value=license;if(doctor&&license)$('doctorName').dataset.mxConfirmedDoctor=doctor;else delete $('doctorName').dataset.mxConfirmedDoctor;$('productSearch').value='';hideDoctorSuggestions();renderSearch();renderCart();try{localStorage.removeItem(DRAFT_KEY)}catch(_e){}saveDraft()}")
          rep("function doctorAuto(){const q=norm($('doctorName').value),m=doctors.find(d=>norm(d.nombre)===q||norm(d.cedula)===q);if(m){$('doctorName').value=txt(m.nombre);if(txt(m.cedula))$('doctorLicense').value=txt(m.cedula)}hideDoctorSuggestions();saveDraft()}","function doctorAuto(){const input=$('doctorName'),q=norm(input.value),m=doctors.find(d=>norm(d.nombre)===q||norm(d.cedula)===q);if(m){input.value=txt(m.nombre);input.dataset.mxConfirmedDoctor=txt(m.nombre);if(txt(m.cedula))$('doctorLicense').value=txt(m.cedula)}hideDoctorSuggestions();saveDraft()}")
          rep("async function startDataEngine(){if(dataStarted)return;dataStarted=true;restoreDraft();renderCart();await restoreCaches();syncTick(true).catch(()=>{});if($('recipeType')?.value)syncRecipeFolio({force:false,forceFill:!txt($('recipeFolio')?.value)}).catch(()=>{});outboxTick().catch(()=>{})}","async function startDataEngine(){if(dataStarted)return;dataStarted=true;restoreDraft();renderCart();await restoreCaches();syncTick(true).catch(()=>{});if($('recipeType')?.value)syncRecipeFolio({force:false,forceFill:!txt($('recipeFolio')?.value)}).catch(()=>{});outboxTick().catch(()=>{});setTimeout(()=>mxRecipeFlowFocus('servedBy'),120)}")
          rep("hide('confirmOverlay');clearDraftAndForm(true);const next=seedNextFolioNow(type,folio),pending=outbox().filter(x=>x.status!=='rejected'&&txt(x.branch||x.payload?.branch).toUpperCase()===txt(cfg.branch).toUpperCase()).length;setStatus(`✅ Receta ${folio} agregada a la cola. Ya puedes capturar ${folioCaptureSeed(next)} mientras ${pending} registro(s) se sincronizan.`,true);focusRecipeFolioTail();renderSearch();queueKick(0)","hide('confirmOverlay');clearDraftAndForm(true,true);const next=seedNextFolioNow(type,folio),pending=outbox().filter(x=>x.status!=='rejected'&&txt(x.branch||x.payload?.branch).toUpperCase()===txt(cfg.branch).toUpperCase()).length;setStatus(`✅ Receta ${folio} agregada a la cola. Médico conservado · selecciona estado para la siguiente receta (${folioCaptureSeed(next)}). ${pending} registro(s) sincronizando.`,true);renderSearch();setTimeout(()=>mxRecipeFlowFocus('recipeState'),80);queueKick(0)")
          anchor="if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();"
          extra="""
          $('servedBy').addEventListener('focus',()=>mxRecipeFlowMark('servedBy'));
          $('servedBy').addEventListener('change',()=>{if(txt($('servedBy').value))setTimeout(()=>mxRecipeFlowFocus('recipeType'),20)});
          $('servedBy').addEventListener('keydown',e=>{if(e.key==='Enter'&&txt($('servedBy').value)){e.preventDefault();mxRecipeFlowFocus('recipeType')}});
          $('recipeType').addEventListener('focus',()=>mxRecipeFlowMark('recipeType'));
          $('recipeType').addEventListener('change',()=>{if(txt($('recipeType').value))setTimeout(()=>mxRecipeFlowFocus('recipeState'),20)});
          $('recipeState').addEventListener('focus',()=>mxRecipeFlowMark('recipeState'));
          $('recipeState').addEventListener('change',()=>{if(txt($('recipeState').value))setTimeout(()=>focusRecipeFolioTail(),25)});
          $('recipeFolio').addEventListener('focus',()=>{mxRecipeFlowMark('recipeFolio');$('recipeFolio').setAttribute('inputmode','numeric')});
          $('recipeFolio').addEventListener('keydown',e=>{if(e.key==='Enter'&&txt($('recipeFolio').value)){e.preventDefault();saveDraft();focusDoctorForFlow()}});
          $('doctorName').addEventListener('focus',()=>{mxRecipeFlowMark('doctorName');$('doctorName').setAttribute('inputmode','text');const confirmed=txt($('doctorName').dataset.mxConfirmedDoctor);if(confirmed&&norm($('doctorName').value)===norm(confirmed)){requestAnimationFrame(()=>{try{$('doctorName').select()}catch(_e){}})}});
          $('doctorName').addEventListener('input',()=>{const input=$('doctorName'),confirmed=txt(input.dataset.mxConfirmedDoctor);if(confirmed&&norm(input.value)!==norm(confirmed)){delete input.dataset.mxConfirmedDoctor;$('doctorLicense').value=''}});
          $('doctorName').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const opts=[...$('doctorSuggestions').querySelectorAll('.doctor-option')];if(opts.length&&doctorSuggestionIndex<0){e.preventDefault();opts[0].dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));return}if(!opts.length&&txt($('doctorName').value)&&txt($('doctorLicense').value)){e.preventDefault();hideDoctorSuggestions();focusProductForFlow()}});
          $('productSearch').addEventListener('focus',()=>mxRecipeFlowMark('productSearch'));
          document.addEventListener('focusin',e=>{const id=e.target?.id;if(['servedBy','recipeType','recipeState','recipeFolio','doctorName','productSearch'].includes(id))mxRecipeFlowMark(id)});
          """
          rep(anchor,extra+'\n'+anchor)
          p.write_text(s,encoding='utf-8')
          pat=re.compile(r'<script\\b([^>]*)>(.*?)</script>',re.I|re.S);tp=re.compile(r"\\btype\\s*=\\s*[\\\"']([^\\\"']+)",re.I)
          checked=0
          for i,(attrs,code) in enumerate(pat.findall(s)):
              if re.search(r'\\bsrc\\s*=',attrs,re.I) or not code.strip(): continue
              mt=tp.search(attrs)
              if mt and mt.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
              fd,tmp=tempfile.mkstemp(suffix='.js');os.close(fd);Path(tmp).write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',tmp],capture_output=True,text=True);os.unlink(tmp)
              if r.returncode: raise RuntimeError(f'script {i}: {r.stderr}')
              checked+=1
          assert checked>=10
          assert "clearDraftAndForm(true,true)" in s and "mxRecipeFlowFocus('recipeState')" in s and "function focusDoctorForFlow()" in s
          print('RECETAS OK; scripts:',checked)
          PY
      - name: Guardar cambio y limpiar workflow
        shell: bash
        run: |
          git config user.name 'Macroxel Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/macroxel-recetas-flujo-rapido.yml
          git add MACROXEL-VISORES-CENTRAL/Recetas-surtido/index.html
          git commit -m 'Optimizar flujo rapido de captura en Recetas'
          git push
