name: Macroxel Tablet Home Fix

on:
  push:
    paths:
      - '.github/workflows/macroxel-tablet-home-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macroxel-tablet-home-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir inicio en tablets Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('MACROXEL-VISORES-CENTRAL')
          files=sorted(root.glob('*/index.html'))
          if len(files)!=9:
              raise SystemExit(f'Se esperaban 9 visores y se encontraron {len(files)}')

          guard=("var __mxPwaUa=navigator.userAgent||'';"
                 "var __mxPwaMin=Math.min((screen&&screen.width)||innerWidth||0,(screen&&screen.height)||innerHeight||0);"
                 "var __mxAndroidTablet=/Android/i.test(__mxPwaUa)&&(!/Mobile/i.test(__mxPwaUa)||__mxPwaMin>=600);"
                 "if(__mxAndroidTablet){document.documentElement.setAttribute('data-mx-home-mode','browser-shortcut');return;}")
          removed=0
          for path in files:
              text=path.read_text(encoding='utf-8')
              patterns=[
                  r'\s*<meta\s+name=["\']mobile-web-app-capable["\']\s+content=["\']yes["\']\s*/?>',
                  r'\s*<meta\s+content=["\']yes["\']\s+name=["\']mobile-web-app-capable["\']\s*/?>',
              ]
              for pat in patterns:
                  text,n=re.subn(pat,'',text,flags=re.I)
                  removed+=n

              anchor='var m={name:"Macroxel'
              if text.count(anchor)!=1:
                  raise SystemExit(f'{path}: manifiesto esperado 1 vez, encontrado {text.count(anchor)}')
              if "data-mx-home-mode','browser-shortcut" in text:
                  raise SystemExit(f'{path}: la corrección de tablet ya existe')
              text=text.replace(anchor,guard+anchor,1)
              path.write_text(text,encoding='utf-8',newline='')

          if removed!=8:
              raise SystemExit(f'Se esperaban quitar 8 meta mobile-web-app-capable y se quitaron {removed}')

          for path in files:
              text=path.read_text(encoding='utf-8')
              if text.count("data-mx-home-mode','browser-shortcut")!=1:
                  raise SystemExit(f'{path}: guard de tablet inválido')
              if re.search(r'<meta\s+[^>]*\bname=["\']mobile-web-app-capable["\']',text,re.I):
                  raise SystemExit(f'{path}: meta antigua Android sigue presente')
              if 'object-fit:cover!important' not in text:
                  raise SystemExit(f'{path}: se perdió splash de pantalla completa')
              print('OK',path)
          PY

      - name: Publicar cambio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Macroxel Hospital'
          git config user.email 'macroxel-hospital@users.noreply.github.com'
          git add MACROXEL-VISORES-CENTRAL/*/index.html
          git commit -m 'Macroxel Hospital: acceso tablet sin splash nativo PWA'
          git push
