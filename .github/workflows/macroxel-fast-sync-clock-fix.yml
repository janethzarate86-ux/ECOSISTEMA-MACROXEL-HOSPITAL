name: Macroxel fast sync and Mexico clock fix

on:
  push:
    paths:
      - '.github/workflows/macroxel-fast-sync-clock-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch visores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, os, sys

          ROOT=Path('MACROXEL-VISORES-CENTRAL')
          def apply(rel, reps):
              p=ROOT/rel
              s=p.read_text(encoding='utf-8')
              before=s
              for old,new,minimum in reps:
                  if new in s and old not in s:
                      continue
                  n=s.count(old)
                  if n < minimum:
                      raise RuntimeError(f'{rel}: faltó marcador ({n}<{minimum}): {old[:120]!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
              print(rel, 'OK', 'changed' if s!=before else 'already')

          apply(Path('COLECTIVOS-Y-PACIENTES/index.html'),[
            ("mxViewerBumpVersion(path);return r.json().catch(()=>true)","await mxViewerBumpVersion(path);return r.json().catch(()=>true)",1),
            ("function mxJustifiedDailyDateKey(d=new Date()){const x=d instanceof Date?d:new Date(d);return Number.isNaN(x.getTime())?'':`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}","const MX_HOSPITAL_TZ='America/Mexico_City';function mxHospitalDateParts(d=new Date()){const x=d instanceof Date?d:new Date(d);if(Number.isNaN(x.getTime()))return null;const p={};for(const q of new Intl.DateTimeFormat('en-CA',{timeZone:MX_HOSPITAL_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(x))if(q.type!=='literal')p[q.type]=q.value;return p}function mxJustifiedDailyDateKey(d=new Date()){const p=mxHospitalDateParts(d);return p?`${p.year}-${p.month}-${p.day}`:''}function mxJustifiedDailyDisplayDate(d=new Date()){const p=mxHospitalDateParts(d);return p?`${p.day}/${p.month}/${p.year}`:''}function mxHospitalDateTime(v){const d=v instanceof Date?v:new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-MX',{timeZone:MX_HOSPITAL_TZ,hour12:false})}",1),
            ("deviceId:deviceId(),createdAt:iso,","deviceId:deviceId(),createdAt:iso,createdAtMs:now.getTime(),",2),
            ("fechaSolicitud:`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`","fechaSolicitud:mxJustifiedDailyDisplayDate(now)",2),
            ("new Date(r.createdAt||Date.now()).toLocaleString('es-MX')","mxHospitalDateTime(r.createdAt||Date.now())",2),
            ("fechaSolicitud:new Date().toLocaleDateString('es-MX')","fechaSolicitud:mxJustifiedDailyDisplayDate(new Date())",1),
            ("setInterval(()=>mxSyncChangedData(false),30000);","setInterval(()=>mxSyncChangedData(false),5000);",1),
            ("setInterval(()=>mxLoadOperationalControls(false),30000);","setInterval(()=>mxLoadOperationalControls(false),10000);",1),
            ("setInterval(()=>mxWatchOrderStatus(false),6000);","setInterval(()=>mxWatchOrderStatus(false),2500);",1),
          ])

          apply(Path('TRANSFERENCIAS/index.html'),[
            ("try{mxTrBumpVersion(path)}catch(_e){}","await mxTrBumpVersion(path);",1),
            ("function formatDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?txt(v):d.toLocaleString('es-MX');}","function formatDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?txt(v):d.toLocaleString('es-MX',{timeZone:'America/Mexico_City',hour12:false});}",1),
            ("requestFolio=retry?(txt(retryOf.requestFolio||retryOf.request_folio||retryOf.folio)||makeRequestFolio()):makeRequestFolio(),now=new Date().toISOString(),items=normalizeTransferItems(sourceItems,d),","requestFolio=retry?(txt(retryOf.requestFolio||retryOf.request_folio||retryOf.folio)||makeRequestFolio()):makeRequestFolio(),nowDate=new Date(),now=nowDate.toISOString(),nowMs=nowDate.getTime(),items=normalizeTransferItems(sourceItems,d),",1),
            ("createdAt:now,updatedAt:now,createdAtText:formatDate(now)","createdAt:now,createdAtMs:nowMs,updatedAt:now,updatedAtMs:nowMs,createdAtText:formatDate(now)",1),
          ])

          apply(Path('SURTIDO-COLEC/index.html'),[
            ("mxBumpVersion(path);return r.json().catch(()=>true)","await mxBumpVersion(path);return r.json().catch(()=>true)",1),
            ("new Intl.DateTimeFormat('es-MX',{dateStyle:'short',timeStyle:'short'}).format(new Date(ms))","new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'}).format(new Date(ms))",1),
            ("new Date(ms).toLocaleString('es-MX')","new Date(ms).toLocaleString('es-MX',{timeZone:'America/Mexico_City',hour12:false})",1),
          ])

          apply(Path('FARMACOVIGILANCIA/index.html'),[
            ("mxFvBump(path);return r.json().catch(()=>null)","await mxFvBump(path);return r.json().catch(()=>null)",1),
            ("mxFvBump(path)}","await mxFvBump(path)}",1),
            ("d.toLocaleString('es-MX',withTime?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'})","d.toLocaleString('es-MX',withTime?{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'}:{timeZone:'America/Mexico_City',dateStyle:'short'})",1),
            ("function fvLocalDay(d){if(!(d instanceof Date)||Number.isNaN(d.getTime()))return'';return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}","function fvLocalDay(d){if(!(d instanceof Date)||Number.isNaN(d.getTime()))return'';const p={};for(const q of new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d))if(q.type!=='literal')p[q.type]=q.value;return`${p.year}-${p.month}-${p.day}`}",1),
            ("loadJustifiedOrders(false).catch(()=>{});if(Date.now()-lastLoadAllAt>180000)scheduleLoadAll(false)},12000)","loadJustifiedOrders(false).catch(()=>{});if(Date.now()-lastLoadAllAt>180000)scheduleLoadAll(false)},2500)",1),
          ])

          apply(Path('EXISTENCIAS/index.html'),[
            ("mxExBumpActivation(path);return true;","await mxExBumpActivation(path);return true;",1),
            ("d.toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})","d.toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'})",1),
            ("function localDayKey(d){if(!(d instanceof Date)||Number.isNaN(d.getTime()))return'';return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}","function localDayKey(d){if(!(d instanceof Date)||Number.isNaN(d.getTime()))return'';const p={};for(const q of new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d))if(q.type!=='literal')p[q.type]=q.value;return `${p.year}-${p.month}-${p.day}`}",1),
            ("setInterval(()=>{if(window.__mxViewerLicensed===true&&!document.hidden)loadOrders(false)},12000)","setInterval(()=>{if(window.__mxViewerLicensed===true&&!document.hidden)loadOrders(false)},2500)",1),
          ])

          apply(Path('ADMINISTRADOR-ECOSISTEMA/index.html'),[
            ("async function get(p){return fetchJson(dbUrl(p)+'?ts='+Date.now())}\nasync function put(p,d,method='PUT'){return fetchJson(dbUrl(p),{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(d)},9000)}\nasync function patch(p,d){return put(p,d,'PATCH')}\nasync function del(p){return put(p,null,'PUT')}","async function get(p){return fetchJson(dbUrl(p)+'?ts='+Date.now())}\nfunction mxAdminSyncKey(p){const x=String(p||'');if(x.includes('/viewer_licenses/')||x.includes('/viewer_activation_resets/'))return'activations';if(x.includes('/service_orders/'))return'orders';if(x.includes('/inventory_count_')||x.includes('/transfer_'))return'transfers';if(x.includes('/inventory_messages/'))return'messages';if(x.includes('/inventory_'))return'inventory';return''}\nasync function mxAdminBump(p){const key=mxAdminSyncKey(p);if(!key||String(p||'').includes('/sync_versions/'))return;try{const v=Math.max(Date.now(),Number(localStorage.getItem('mx_admin_sync_'+key)||0)+1);localStorage.setItem('mx_admin_sync_'+key,String(v));await fetchJson(dbUrl(`/sync_versions/${safeKey(branch())}/${key}`),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v,updatedAt:new Date().toISOString(),source:'ADMINISTRADOR_ECOSISTEMA'})},5000)}catch(_e){}}\nasync function put(p,d,method='PUT'){const out=await fetchJson(dbUrl(p),{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(d)},9000);await mxAdminBump(p);return out}\nasync function patch(p,d){return put(p,d,'PATCH')}\nasync function del(p){return put(p,null,'PUT')}",1),
            ("d.toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})","d.toLocaleString('es-MX',{timeZone:'America/Mexico_City',dateStyle:'short',timeStyle:'short'})",1),
            ("d.toLocaleDateString('es-MX')","d.toLocaleDateString('es-MX',{timeZone:'America/Mexico_City'})",1),
            ("pollTimer=setInterval(()=>{if(!document.hidden)refresh(currentTab)},12000)","pollTimer=setInterval(()=>{if(!document.hidden)refresh(currentTab)},2500)",1),
          ])

          apply(Path('CENSO-HOSPITALARIO/index.html'),[
            ("async function fbGet(path){const r=await mxFetchTimeout(dbUrl(path)+'?ts='+Date.now(),{cache:'no-store'},7000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>null)}\nasync function fbPut(path,data){const r=await mxFetchTimeout(dbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'},9000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>null)}\nasync function fbPatch(path,data){const r=await mxFetchTimeout(dbUrl(path),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'},9000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>null)}","async function fbGet(path){const r=await mxFetchTimeout(dbUrl(path)+'?ts='+Date.now(),{cache:'no-store'},7000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>null)}\nfunction mxCensoSyncKey(path){const p=String(path||'');if(p.includes('/viewer_licenses/'))return'activations';if(p.includes('/hospital_census/')||p.includes('/patient_catalog/'))return'patients';return''}\nasync function mxCensoBump(path){const key=mxCensoSyncKey(path);if(!key||String(path||'').includes('/sync_versions/'))return;try{const v=Math.max(Date.now(),Number(localStorage.getItem('mx_censo_sync_'+key)||0)+1);localStorage.setItem('mx_censo_sync_'+key,String(v));await mxFetchTimeout(dbUrl(`/sync_versions/${safePath(branch())}/${key}`),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({v,updatedAt:new Date().toISOString(),source:'CENSO_HOSPITALARIO'}),cache:'no-store'},5000)}catch(_e){}}\nasync function fbPut(path,data){const r=await mxFetchTimeout(dbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'},9000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);const out=await r.json().catch(()=>null);await mxCensoBump(path);return out}\nasync function fbPatch(path,data){const r=await mxFetchTimeout(dbUrl(path),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'},9000);if(!r.ok)throw new Error('Firebase HTTP '+r.status);const out=await r.json().catch(()=>null);await mxCensoBump(path);return out}",1),
          ])

          admin=ROOT/'ADMINISTRADOR/index.html'
          if admin.exists():
              x=admin.read_text(encoding='utf-8')
              if 'fastPollMs:8000' in x: x=x.replace('fastPollMs:8000','fastPollMs:2500')
              admin.write_text(x,encoding='utf-8')

          # Validación de sintaxis de cada script JS inline modificado.
          targets=[ROOT/x for x in [
            'COLECTIVOS-Y-PACIENTES/index.html','TRANSFERENCIAS/index.html','SURTIDO-COLEC/index.html',
            'FARMACOVIGILANCIA/index.html','EXISTENCIAS/index.html','ADMINISTRADOR-ECOSISTEMA/index.html',
            'CENSO-HOSPITALARIO/index.html','ADMINISTRADOR/index.html']]
          pat=re.compile(r'<script\b([^>]*)>(.*?)</script>',re.I|re.S)
          for p in targets:
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              for i,(attrs,code) in enumerate(pat.findall(text)):
                  if re.search(r'\bsrc\s*=',attrs,re.I): continue
                  mt=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
                  if mt and mt.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
                  if not code.strip(): continue
                  fd,tmp=tempfile.mkstemp(suffix='.js'); os.close(fd)
                  Path(tmp).write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',tmp],capture_output=True,text=True)
                  os.unlink(tmp)
                  if r.returncode:
                      raise RuntimeError(f'JS inválido {p} script {i}: {r.stderr[:700]}')
          print('JS syntax OK')
          PY
      - name: Verify critical markers
        shell: bash
        run: |
          grep -q "America/Mexico_City" MACROXEL-VISORES-CENTRAL/COLECTIVOS-Y-PACIENTES/index.html
          grep -q "createdAtMs:now.getTime()" MACROXEL-VISORES-CENTRAL/COLECTIVOS-Y-PACIENTES/index.html
          grep -q "await mxTrBumpVersion(path)" MACROXEL-VISORES-CENTRAL/TRANSFERENCIAS/index.html
          grep -q "createdAtMs:nowMs" MACROXEL-VISORES-CENTRAL/TRANSFERENCIAS/index.html
          grep -q "await mxBumpVersion(path)" MACROXEL-VISORES-CENTRAL/SURTIDO-COLEC/index.html
          grep -q "await mxFvBump(path)" MACROXEL-VISORES-CENTRAL/FARMACOVIGILANCIA/index.html
          grep -q "2500)" MACROXEL-VISORES-CENTRAL/FARMACOVIGILANCIA/index.html
          grep -q "mxAdminBump" MACROXEL-VISORES-CENTRAL/ADMINISTRADOR-ECOSISTEMA/index.html
          grep -q "mxCensoBump" MACROXEL-VISORES-CENTRAL/CENSO-HOSPITALARIO/index.html
      - name: Commit clean result
        shell: bash
        run: |
          git config user.name "Macroxel Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/macroxel-fast-sync-clock-fix.yml
          git add MACROXEL-VISORES-CENTRAL
          git commit -m "Acelerar sincronización y fijar hora México en visores"
          git push origin HEAD:main
