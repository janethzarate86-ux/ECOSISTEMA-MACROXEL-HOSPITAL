name: Corregir Firebase Administrador

on:
  push:
    paths:
      - '.github/workflows/mx-fix-admin-firebase-status.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Corregir visor Administrador
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MACROXEL-VISORES-CENTRAL/ADMINISTRADOR/index.html')
          s=p.read_text(encoding='utf-8')
          def rep(a,b,n=1,label=''):
           global s
           c=s.count(a)
           assert c==n,(label or a[:50],c)
           s=s.replace(a,b,n)
          rep("const CONTROL_DB='https://ecosistema-macroxel-default-rtdb.firebaseio.com',ONLINE_MS=90000,RECENT_MS=86400000;","const CONTROL_DB='https://ecosistema-macroxel-default-rtdb.firebaseio.com',ONLINE_MS=90000,RECENT_MS=86400000,FIREBASE_PROBE_MS=4200;",label='const')
          rep("let principals=[],viewers=[],controls={},meta={},audit=[],registry={},selectedBranch='';","let principals=[],viewers=[],controls={},meta={},audit=[],registry={},firebaseHealth={},selectedBranch='';",label='vars')
          rep("function linkAdminToGroup(g){const p=primary(g),db=clean(p?.firebaseUrl||p?.currentUrl||p?.db||p?.url);if(!db)return null;return window.mxAdminSetTarget?.({db,branch:g.branch,unitName:p?.unitName||p?.principalName||g.branch})||null}","function linkAdminToGroup(g){const p=primary(g),db=systemFirebaseUrl(g);if(!db)return null;return window.mxAdminSetTarget?.({db,branch:g.branch,unitName:p?.unitName||p?.principalName||g.branch})||null}",label='link')
          old="""function firebaseRoutesFor(g){
            const p=primary(g),urls=[];
            if(txt(p?.firebaseUrl))urls.push(txt(p.firebaseUrl));
            if(Array.isArray(p?.firebaseUrls))for(const x of p.firebaseUrls)if(txt(x))urls.push(txt(x));
            return [...new Set(urls.map(clean).filter(Boolean))]
          }
          """
          new="""function firebaseRoutesFor(g){const urls=[];for(const r of [...(g?.principals||[]),...(g?.registry||[])]){for(const k of ['firebaseUrl','currentUrl','db','url'])if(txt(r?.[k]))urls.push(txt(r[k]));if(Array.isArray(r?.firebaseUrls))for(const x of r.firebaseUrls)if(txt(x))urls.push(txt(x))}return [...new Set(urls.map(clean).filter(Boolean))]}
          function systemFirebaseUrl(g){return firebaseRoutesFor(g)[0]||''}
          function systemState(g){const ps=g?.principals||[],p=primary(g),pa=ps.length>0&&ps.every(principalRemotePaused),localOff=!pa&&p?.connectionPaused===true,h=firebaseHealth?.[g.branch];if(pa)return{code:'pause',connected:false,label:'Firebase desconectado desde Administrador'};if(localOff)return{code:'pause',connected:false,label:'Firebase desconectado localmente'};if(h?.ok===true)return{code:'on',connected:true,label:'Conectado a Firebase'};if(ps.some(online))return{code:'on',connected:true,label:'Conectado a Firebase · señal reciente'};if(h?.ok===false)return{code:'off',connected:false,label:'Sin conexión a Firebase'};return{code:'check',connected:false,label:'Verificando Firebase'}}
          async function probeFirebase(g){const db=systemFirebaseUrl(g);if(!db)return{ok:false,url:'',status:0,at:now()};const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),FIREBASE_PROBE_MS);try{const r=await fetch(db+'/viewer_users/'+encodeURIComponent(g.branch)+'/__mx_admin_probe__.json?mxadmin='+Date.now(),{cache:'no-store',signal:ctl.signal});return{ok:r.ok||r.status===401||r.status===403,url:db,status:r.status,at:now()}}catch(_e){return{ok:false,url:db,status:0,at:now()}}finally{clearTimeout(timer)}}
          async function refreshFirebaseHealth(groups){const pairs=await Promise.all((groups||[]).map(async g=>[g.branch,await probeFirebase(g)]));firebaseHealth=Object.fromEntries(pairs)}
          """
          rep(old,new,label='routes/helpers')
          rep("    const ss=systems();\n    if(selectedBranch&&!ss.some(x=>x.branch===selectedBranch))", "    const ss=systems();\n    await refreshFirebaseHealth(ss);\n    if(selectedBranch&&!ss.some(x=>x.branch===selectedBranch))",label='load')
          rep("const p=primary(g),on=(g.principals||[]).some(online),pa=(g.principals||[]).length>0&&(g.principals||[]).every(principalRemotePaused),vg=viewerGroups(g),active=g.branch===selectedBranch;","const p=primary(g),st=systemState(g),vg=viewerGroups(g),active=g.branch===selectedBranch;",label='render vars')
          rep("class=\"dot ${pa?'pause':on?'on':''}\"","class=\"dot ${st.code==='pause'?'pause':st.connected?'on':''}\"",label='render dot')
          rep("${pa?'Firebase desconectado':on?'En línea':'Sin señal reciente'}","${st.label}",label='render label')
          rep("const p=primary(g),ps=g.principals||[],on=ps.some(online),pa=ps.length&&ps.every(principalRemotePaused),vgs=viewerGroups(g),allViewerMembers=g.viewers||[],allPaused=allViewerMembers.length&&allViewerMembers.every(paused);","const p=primary(g),ps=g.principals||[],st=systemState(g),on=st.connected,pa=st.code==='pause',vgs=viewerGroups(g),allViewerMembers=g.viewers||[],allPaused=allViewerMembers.length&&allViewerMembers.every(paused);",label='system vars')
          rep("const sysState=document.getElementById('mxNetSystemState');const localOff=!pa&&p?.connectionPaused===true;sysState.textContent=`${pa?'🔴 Firebase desconectado desde Administrador':localOff?'🔴 Firebase desconectado localmente':on?'🟢 Sistema en línea':'⚪ Sin señal reciente'} · ID ${g.branch}`;sysState.className='mx-net-state '+((pa||localOff)?'bad':on?'ok':'warn');","const sysState=document.getElementById('mxNetSystemState');sysState.textContent=`${on?'🟢':pa?'🔴':'⚪'} ${st.label} · ID ${g.branch}`;sysState.className='mx-net-state '+(pa?'bad':on?'ok':'warn');",label='system state')
          rep("${pa?'🔴 Desconectado desde Administrador':localOff?'🔴 Desconectado localmente':on?'🟢 Conectado':'⚪ Sin señal'}","${on?'🟢 Conectado a Firebase':pa?'🔴 '+st.label:'⚪ '+st.label}",label='info state')
          rep("if(deleteBtn){const principalLive=ps.some(online),viewerLive=", "if(deleteBtn){const principalLive=on||ps.some(online),viewerLive=",label='delete safety')
          assert '<html' in s.lower() and '</html>' in s.lower()
          p.write_text(s,encoding='utf-8')
          print('Administrador actualizado',len(s))
          PY
      - name: Validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('MACROXEL-VISORES-CENTRAL/ADMINISTRADOR/index.html').read_text(encoding='utf-8')
          assert 'function systemFirebaseUrl(g)' in s
          assert 'await refreshFirebaseHealth(ss);' in s
          assert 'Conectado a Firebase' in s
          a=s.find('<script id="mx-network-center-v124">');a=s.find('>',a)+1;b=s.find('</script>',a)
          Path('/tmp/admin-network.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/admin-network.js
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name 'janethzarate86-ux'
          git config user.email 'janethzarate86-ux@users.noreply.github.com'
          git add MACROXEL-VISORES-CENTRAL/ADMINISTRADOR/index.html
          git commit -m 'Administrador: validar conexión real a Firebase'
          git push origin HEAD:main
